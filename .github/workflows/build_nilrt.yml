name: NI Linux Real-Time Build

on:
  workflow_call:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-nilrt:
    name: NILRT ${{ matrix.config.arch }} Cross Compile
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            arch: "x64", os: ubuntu-latest,
            toolchain_file: "cmake/nilrt-x86_64.cmake",
            drivers: "", build_target: "all", package_tests: true
          }
        - {
            arch: "armv7-a", os: ubuntu-24.04-arm,
            toolchain_file: "cmake/nilrt-armv7.cmake",
            drivers: "visa", build_target: "ni_grpc_device_server", package_tests: false
          }

    env:
      # TEMPORARY: Upload PR artifacts while validating ARMv7 packaging in this PR.
      # Remove the pull_request clause after validation to restore release-only uploads.
      UPLOAD_SERVER_ARTIFACTS: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/releases') }}

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Setup python3
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Setup Ninja
      if: ${{ matrix.config.arch == 'x64' }}
      uses: seanmiddleditch/gha-setup-ninja@v5
      with:
          version: 1.12.1

    - name: Install Build Tools on ARM64 Host
      if: ${{ matrix.config.arch == 'armv7-a' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build qemu-user-binfmt

    - name: Setup cmake
      if: ${{ matrix.config.arch == 'x64' }}
      uses: jwlawson/actions-setup-cmake@v2
      with:
          cmake-version: '3.18.x'

    - name: Get number of CPU cores
      uses: SimenB/github-actions-cpu-cores@v2
      id: cpu-cores

    # The URL used to download this toolchain may change in the future as
    # improvements to hosting and exports of the NILRT toolchain are made.
    - name: Install NI Linux RT x64 Toolchain
      if: ${{ matrix.config.arch == 'x64' }}
      run: |
        wget -nv https://download.ni.com/support/softlib/labview/labview_rt/2023Q4/LinuxToolchains/linux/oecore-x86_64-core2-64-toolchain-10.0.sh
        sudo chmod a+x ./oecore-x86_64-core2-64-toolchain-10.0.sh
        sudo ./oecore-x86_64-core2-64-toolchain-10.0.sh -y -d $GITHUB_WORKSPACE/nilrt-toolchain/
        echo "$GITHUB_WORKSPACE/nilrt-toolchain/sysroots/x86_64-nilrtsdk-linux/usr/bin/x86_64-nilrt-linux" >> $GITHUB_PATH

    - name: Install NI Linux RT ARMv7 Toolchain
      if: ${{ matrix.config.arch == 'armv7-a' }}
      run: |
        wget -nv https://download.ni.com/support/softlib/labview/labview_rt/2018/Linux%20Toolchains/linux/oecore-x86_64-cortexa9-vfpv3-toolchain-6.0.sh -O nilrt-armv7-toolchain.sh
        chmod a+x ./nilrt-armv7-toolchain.sh
        # The wrapper rejects non-x64 hosts. QEMU runs the bundled x64 compiler tools so they
        # remain ABI-compatible with the 2018 target sysroot.
        grep -qF 'SDK_ARCH=$(echo x86_64 |' ./nilrt-armv7-toolchain.sh
        sed -i 's/^SDK_ARCH=.*$/SDK_ARCH=$(uname -m)/' ./nilrt-armv7-toolchain.sh
        grep -qxF 'SDK_ARCH=$(uname -m)' ./nilrt-armv7-toolchain.sh
        ./nilrt-armv7-toolchain.sh -y -d $GITHUB_WORKSPACE/nilrt-toolchain/

    - name: Update Submodules
      id: submodules
      run: |
        git submodule update --init --recursive
        echo "grpc-commit=$(git rev-parse --short @:./third_party/grpc)" >> $GITHUB_OUTPUT

    - name: Cache Host OS gRPC Support
      uses: actions/cache@v4
      id: hostgrpccache
      env:
        cache-name: hostgrpccache
      with:
        path: third_party/grpc/build/
        key: ${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-${{ env.cache-name }}-${{ steps.submodules.outputs.grpc-commit }}

    - name: Configure Host OS gRPC Support
      if: steps.hostgrpccache.outputs.cache-hit != 'true'
      run: >
        cmake
        -S $GITHUB_WORKSPACE/third_party/grpc/
        -B $GITHUB_WORKSPACE/third_party/grpc/build
        -D CMAKE_BUILD_TYPE=$BUILD_TYPE
        -D gRPC_INSTALL=ON
        -D gRPC_BUILD_TESTS=OFF
        -G "Ninja"

    - name: Build Host OS gRPC Support
      if: steps.hostgrpccache.outputs.cache-hit != 'true'
      run: >
        cmake
        --build $GITHUB_WORKSPACE/third_party/grpc/build
        -j ${{ steps.cpu-cores.outputs.count }}

    - name: Install Host OS gRPC Support
      run: sudo cmake --install $GITHUB_WORKSPACE/third_party/grpc/build

    - name: Configure Cross Compile
      run: >
        cmake
        -S .
        -B build
        -D CMAKE_BUILD_TYPE=$BUILD_TYPE
        -D CMAKE_TOOLCHAIN_FILE=${{ matrix.config.toolchain_file }}
        -D NILRT_TOOLCHAIN_ROOT=$GITHUB_WORKSPACE/nilrt-toolchain
        -D NIDRIVERS_TO_BUILD=${{ matrix.config.drivers }}
        -D USE_NILRT_LEGACY_TOOLCHAIN=on
        -G "Ninja"

    - name: Cross Compile
      run: >
        cmake
        --build build
        --target ${{ matrix.config.build_target }}
        -j ${{ steps.cpu-cores.outputs.count }}

    # The generated source in git must match the output of workflow builds.
    # If this step fails, something is changing during build. Either:
    # 1. Fix non-deterministic codegen, OR
    # 2. Build locally to ensure generated files are up-to-date.
    - name: Check for files dirtied by codegen
      run: git diff --exit-code

    - name: Tar Server Build Files
      if: ${{ env.UPLOAD_SERVER_ARTIFACTS == 'true' }}
      run: >-
        tar -cvzf ni-grpc-device-server-ni-linux-rt-${{ matrix.config.arch }}.tar.gz
        -C $GITHUB_WORKSPACE/build
        ni_grpc_device_server
        server_config.json
        server_capabilities.json
        server_nitlsconfig.json
        ni-grpc-device.conf.yml
        ni-grpc-device.caps.yml
        -C $GITHUB_WORKSPACE
        LICENSE
        ThirdPartyNotices.txt

    - name: Tar Server Debug Symbols
      if: ${{ env.UPLOAD_SERVER_ARTIFACTS == 'true' }}
      run: >-
        tar -cvzf ni-grpc-device-server-ni-linux-rt-${{ matrix.config.arch }}-debug-symbols.tar.gz
        -C $GITHUB_WORKSPACE/build
        ni_grpc_device_server.dbg
        -C $GITHUB_WORKSPACE
        LICENSE
        ThirdPartyNotices.txt

    - name: Upload Server Artifact
      uses: actions/upload-artifact@v4
      if: ${{ env.UPLOAD_SERVER_ARTIFACTS == 'true' }}
      with:
        name: ni-grpc-device-server-ni-linux-rt-${{ matrix.config.arch }}
        path: ni-grpc-device-server-ni-linux-rt-${{ matrix.config.arch }}.tar.gz
        retention-days: 5

    - name: Upload Server Debug Symbols Artifact
      uses: actions/upload-artifact@v4
      if: ${{ env.UPLOAD_SERVER_ARTIFACTS == 'true' }}
      with:
        name: ni-grpc-device-server-ni-linux-rt-${{ matrix.config.arch }}-debug-symbols
        path: ni-grpc-device-server-ni-linux-rt-${{ matrix.config.arch }}-debug-symbols.tar.gz
        retention-days: 5

    - name: Tar Test Build Files
      if: ${{ matrix.config.package_tests && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/releases')) }}
      run: >-
        tar -cvzf ni-grpc-device-tests-ni-linux-rt-x64.tar.gz
        -C $GITHUB_WORKSPACE/build
        certs/
        IntegrationTestsRunner
        libTestApi.so
        SystemTestsRunner
        test_localhost_config.json
        test_mutual_tls_config.json
        UnitTestsRunner
        -C $GITHUB_WORKSPACE
        LICENSE
        ThirdPartyNotices.txt

    - name: Upload Tests Artifact
      uses: actions/upload-artifact@v4
      if: ${{ matrix.config.package_tests && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/releases')) }}
      with:
        name: ni-grpc-device-tests-ni-linux-rt-x64
        path: ni-grpc-device-tests-ni-linux-rt-x64.tar.gz
        retention-days: 5
